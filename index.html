<style>
  :root {
    --bg: #10142b;
    --card: #1b2150;
    --card2: #232a63;
    --morning: #ffb648;
    --morning-dark: #c97f12;
    --night: #4361ee;
    --night-dark: #26339c;
    --evening: #ef476f;
    --evening-dark: #b3234f;
    --off: #06d6a0;
    --off-dark: #048a63;
    --friday-off: #8d99ae;
    --friday-off-dark: #5a6577;
    --text: #ffffff;
    --muted: #b8bfe8;
    --gold: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    direction: rtl; text-align: right; width:100%;
  }
  .app { max-width: 900px; margin: 0 auto; padding-bottom: 20px; background: var(--bg); }
  header.top {
    background: linear-gradient(135deg, #1e2a5a 0%, #3949ab 60%, #7b1fa2 100%);
    padding: 22px 16px 18px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
    position: sticky; top:0; z-index: 50;
  }
  header.top h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: 0.5px; }
  header.top .sub { font-size: 14px; color: var(--muted); }
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 14px 12px 6px; background: var(--bg);
  }
  .legend .item {
    display:flex; align-items:center; gap:6px; font-size:13px;
    background: var(--card2); padding: 6px 10px; border-radius: 20px;
  }
  .legend .dot { width:14px; height:14px; border-radius:50%; display:inline-block; }
  .tabs {
    display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    position: sticky; top: 112px; z-index: 40; background: var(--bg);
    border-bottom: 1px solid #2a2f5e;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab-btn {
    flex: 0 0 auto; padding: 10px 18px; border-radius: 22px; border: none;
    background: var(--card2); color: var(--muted); font-size: 15px; font-weight: 700;
    white-space: nowrap; cursor:pointer;
  }
  .tab-btn.active { background: var(--gold); color: #1e2a5a; }
  .month { display:none; padding: 14px 12px 30px; background: var(--bg); }
  .month.active { display:block; }
  .month h2 { text-align:center; font-size: 22px; margin: 4px 0 14px; color: var(--gold); }
  .grid { display:grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
  .wd-head { text-align:center; font-size: 12px; color: var(--muted); padding-bottom: 4px; font-weight:700; }
  .day {
    border-radius: 12px; padding: 8px 6px 6px; min-height: 108px;
    display:flex; flex-direction:column; gap:4px; position:relative;
    border: 2px solid rgba(255,255,255,0.08);
  }
  .day.empty { background: transparent; border: none; }
  .day .num { font-size: 17px; font-weight:800; }
  .day .wdname { font-size: 10px; opacity:0.85; margin-top:-4px; }
  .day .shift { font-size: 15px; font-weight:900; margin-top:4px; line-height:1.25; }
  .day .icon { font-size: 22px; display:block; margin-bottom:2px; }
  .day.today { outline: 3px solid #fff; outline-offset: 1px; }
  .m-בוקר { background: linear-gradient(160deg, var(--morning), var(--morning-dark)); }
  .m-לילה { background: linear-gradient(160deg, var(--night), var(--night-dark)); }
  .m-ערב { background: linear-gradient(160deg, var(--evening), var(--evening-dark)); }
  .m-חופש { background: linear-gradient(160deg, var(--off), var(--off-dark)); color:#04321f; }
  .m-חופש .shift { color:#04321f; }
  .m-שישי { background: linear-gradient(160deg, var(--friday-off), var(--friday-off-dark)); }
</style>

const MONTHS_ORDER = [[2026, 9], [2026, 10], [2026, 11], [2026, 12], [2027, 1], [2027, 2], [2027, 3], [2027, 4], [2027, 5], [2027, 6], [2027, 7], [2027, 8]];
const MONTH_NAMES = {"1": "ינואר", "2": "פברואר", "3": "מרץ", "4": "אפריל", "5": "מאי", "6": "יוני", "7": "יולי", "8": "אוגוסט", "9": "ספטמבר", "10": "אוקטובר", "11": "נובמבר", "12": "דצמבר"};
const WD_HEAD = ["א","ב","ג","ד","ה","ו","ש"];
const TODAY = new Date().toISOString().slice(0,10);

const byMonth = {};
SCHEDULE.forEach(d => {
  const key = d.year + "-" + d.month;
  if(!byMonth[key]) byMonth[key] = [];
  byMonth[key].push(d);
});

function pyWeekdayIndex(dateStr) {
  const dt = new Date(dateStr + "T00:00:00");
  return dt.getDay();
}

const tabsEl = document.getElementById('tabs');
const monthsEl = document.getElementById('months');

MONTHS_ORDER.forEach((ym, i) => {
  const [y,m] = ym;
  const key = y + "-" + m;
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0 ? ' active' : '');
  btn.textContent = MONTH_NAMES[m] + " " + y;
  btn.onclick = () => showMonth(key);
  btn.dataset.key = key;
  tabsEl.appendChild(btn);

  const monthDiv = document.createElement('div');
  monthDiv.className = 'month' + (i===0 ? ' active' : '');
  monthDiv.id = 'month-' + key;
  const h2 = document.createElement('h2');
  h2.textContent = MONTH_NAMES[m] + " " + y;
  monthDiv.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';
  WD_HEAD.forEach(w => {
    const wh = document.createElement('div');
    wh.className = 'wd-head'; wh.textContent = w;
    grid.appendChild(wh);
  });

  const days = byMonth[key];
  const firstDow = pyWeekdayIndex(days[0].date);
  for(let e=0; e<firstDow; e++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    grid.appendChild(empty);
  }
  days.forEach(d => {
    const cell = document.createElement('div');
    let cls = 'day m-' + (d.friday_override ? 'שישי' : d.shift_name);
    if(d.date === TODAY) cls += ' today';
    cell.className = cls;
    const icon = d.friday_override ? '🕯️' : (d.code==='ב'?'☀️': d.code==='ל'?'🌙': d.code==='ע'?'🌆':'🏖️');
    const label = d.friday_override ? 'שישי-שבת' : d.shift_name;
    cell.innerHTML = `
      <div class="num">${d.day}</div>
      <div class="wdname">${d.wd_name}</div>
      <div class="shift"><span class="icon">${icon}</span>${label}</div>
    `;
    grid.appendChild(cell);
  });
  monthDiv.appendChild(grid);
  monthsEl.appendChild(monthDiv);
});

function showMonth(key) {
  document.querySelectorAll('.month').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('month-' + key).classList.add('active');
  document.querySelector(`.tab-btn[data-key="${key}"]`).classList.add('active');
  const activeBtn = document.querySelector(`.tab-btn[data-key="${key}"]`);
  activeBtn.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}

setTimeout(() => {
  const active = document.querySelector('.tab-btn.active');
  if(active) active.scrollIntoView({inline:'center', block:'nearest'});
}, 100);
