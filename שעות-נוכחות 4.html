  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Heebo', sans-serif;
    background-image: var(--floral), linear-gradient(180deg, var(--cream) 0%, var(--amber-light) 100%);
    background-repeat: repeat, no-repeat;
    background-size: 220px 220px, 100% 100%;
    background-attachment: fixed, scroll;
    color: var(--brown);

    margin:0;

  header .sub{
    font-family:'Gveret Levin', cursive;
    font-size:15px;
    color: var(--brown-soft);

  .status-panel{
    margin: 6px 16px 4px;
    text-align:center;
  }

    font-weight:500;

    border:1px solid rgba(232,93,40,0.25);
    color: var(--brown);

    width:8px; height:8px; border-radius:50%;

<body>
<div class="app">
  <header>
    <h1>שעות נוכחות</h1>
    <div class="sub" id="todayLabel"></div>
  </header>

  <div class="status-panel">

  <main>

        הוספת משמרת בדיעבד

    </div>

    <div class="month-summary">
      <div class="summary-card">
        <div class="num" id="monthHours">0</div>

      </div>
      <div class="summary-card">
        <div class="num" id="monthDays">0</div>

    <div class="day-list" id="dayList"></div>
  </main>

  <div class="thumb-zone">
    <div class="thumb-wrap">
      <div class="thumb-hint" id="thumbHint">לחצי כדי להתחיל משמרת</div>
      <button class="thumb-btn" id="thumbBtn" aria-label="החתמת שעון">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 20 C33 20 20 33 20 50 C20 60 24 68 30 74" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M50 28 C38 28 28 38 28 50 C28 57 30.5 63 34.5 67.5" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M50 36 C42.4 36 36 42.4 36 50 C36 55 38 59 41 62" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M50 44 C46.7 44 44 46.7 44 50 C44 52.5 45 54.5 46.5 56" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M50 20 C67 20 80 33 80 50 C80 62 74 71 68 78" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M50 28 C62 28 72 38 72 50 C72 57 69.5 63 65.5 68" stroke="white" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card">
    <h3 id="modalTitle">עריכת משמרת</h3>
    <div class="field">
      <label for="editDate">תאריך</label>
      <input type="date" id="editDate">
    </div>
    <div class="field">
      <label for="editStart">שעת כניסה</label>
      <input type="time" id="editStart">
    </div>
    <div class="field">
      <label for="editEnd">שעת יציאה</label>
      <input type="time" id="editEnd">
    </div>
    <div class="field-error" id="editError">יש למלא תאריך ושעת כניסה</div>
    <div class="field">
      <label for="editNote">הערה (לא חובה)</label>
      <textarea id="editNote" placeholder="לדוגמה: משמרת כפולה, כיסוי לחברה"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelEditBtn">ביטול</button>
      <button class="btn btn-save" id="saveEditBtn">שמירה</button>
    </div>
    <button class="btn btn-delete" id="deleteEditBtn">מחיקת משמרת</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var HEB_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  var HEB_DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];

  var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" stroke="#E85D28" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 6l3 3" stroke="#E85D28" stroke-width="1.7"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 7h14" stroke="#D64545" stroke-width="1.7" stroke-linecap="round"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2" stroke="#D64545" stroke-width="1.7"/><path d="M7 7l1 13h8l1-13" stroke="#D64545" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="#D64545" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var ICON_FLAG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3v18" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/><path d="M6 4c3-1.5 5 1.5 8 0 1.4-0.7 2 0 2 0v9s-0.6-0.7-2 0c-3 1.5-5-1.5-8 0V4z" fill="#E5292A" stroke="#B91C1C" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  var ICON_FLOWER = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><ellipse cx="12" cy="7" rx="2.6" ry="3.4" fill="#FFC97A"/><ellipse cx="12" cy="17" rx="2.6" ry="3.4" fill="#FFC97A"/><ellipse cx="7" cy="12" rx="3.4" ry="2.6" fill="#FFB84D"/><ellipse cx="17" cy="12" rx="3.4" ry="2.6" fill="#FFB84D"/><ellipse cx="8.6" cy="8.6" rx="2.6" ry="3.2" transform="rotate(-45 8.6 8.6)" fill="#FFA857"/><ellipse cx="15.4" cy="15.4" rx="2.6" ry="3.2" transform="rotate(-45 15.4 15.4)" fill="#FFA857"/><ellipse cx="15.4" cy="8.6" rx="2.6" ry="3.2" transform="rotate(45 15.4 8.6)" fill="#FFA857"/><ellipse cx="8.6" cy="15.4" rx="2.6" ry="3.2" transform="rotate(45 8.6 15.4)" fill="#FFA857"/><circle cx="12" cy="12" r="2.4" fill="#E85D28"/></g></svg>';

  var shifts = [];
  var viewYear, viewMonth;
  var timerInterval = null;
  var storageOk = true;

  var todayLabel = document.getElementById('todayLabel');
  var statusBadge = document.getElementById('statusBadge');
  var statusText = document.getElementById('statusText');
  var elapsedText = document.getElementById('elapsedText');
  var monthLabel = document.getElementById('monthLabel');
  var monthHours = document.getElementById('monthHours');
  var monthDays = document.getElementById('monthDays');
  var dayList = document.getElementById('dayList');
  var thumbBtn = document.getElementById('thumbBtn');
  var thumbHint = document.getElementById('thumbHint');
  var toast = document.getElementById('toast');

  var modalOverlay = document.getElementById('modalOverlay');
  var modalTitle = document.getElementById('modalTitle');
  var editDate = document.getElementById('editDate');
  var editStart = document.getElementById('editStart');
  var editEnd = document.getElementById('editEnd');
  var editNote = document.getElementById('editNote');
  var editError = document.getElementById('editError');
  var saveEditBtn = document.getElementById('saveEditBtn');
  var cancelEditBtn = document.getElementById('cancelEditBtn');
  var deleteEditBtn = document.getElementById('deleteEditBtn');
  var editingId = null;
  var deleteConfirmTimeout = null;

  function pad(n){ return n<10 ? '0'+n : ''+n; }

  function dateKey(d){
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }

  function fmtTime(iso){
    var d = new Date(iso);
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function fmtDateLong(dateStr){
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    return 'יום '+HEB_DAYS[d.getDay()]+', '+d.getDate()+' ב'+HEB_MONTHS[d.getMonth()];
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  function findOpenShift(){
    for(var i=0;i<shifts.length;i++){
      if(!shifts[i].end) return shifts[i];
    }
    return null;
  }

  async function saveShifts(){
    var payload = JSON.stringify(shifts);
    try{
      if(window.storage){
        var res = await window.storage.set('shifts_v1', payload, false);
        if(!res) throw new Error('no result');
        try{ localStorage.setItem('shifts_v1', payload); }catch(e2){}
        return;
      }
    }catch(e){ /* fall through to localStorage */ }
    try{
      localStorage.setItem('shifts_v1', payload);
    }catch(e){
      storageOk = false;
      showToast('שמירה נכשלה, נסי שוב');
    }
  }

  async function loadShifts(){
    try{
      if(window.storage){
        var res = await window.storage.get('shifts_v1', false);
        if(res && res.value){
          shifts = JSON.parse(res.value);
          return;
        }
      }
    }catch(e){ /* fall through to localStorage */ }
    try{
      var raw = localStorage.getItem('shifts_v1');
      if(raw){ shifts = JSON.parse(raw); }
    }catch(e){
      shifts = [];
    }
  }

  function updateTodayLabel(){
    var now = new Date();
    todayLabel.textContent = 'יום '+HEB_DAYS[now.getDay()]+', '+now.getDate()+' ב'+HEB_MONTHS[now.getMonth()]+' '+now.getFullYear();
  }

  function updateStatus(){
    var open = findOpenShift();
    if(open){
      document.body.classList.add('on-shift');
      statusBadge.classList.add('active');
      statusText.textContent = 'במשמרת מ-'+fmtTime(open.start);
      thumbBtn.classList.add('active');
      thumbHint.textContent = 'לחצי כדי לסיים משמרת';
      startTimer(open.start);
    } else {
      document.body.classList.remove('on-shift');
      statusBadge.classList.remove('active');
      statusText.textContent = 'מחוץ למשמרת';
      thumbBtn.classList.remove('active');
      thumbHint.textContent = 'לחצי כדי להתחיל משמרת';
      stopTimer();
      elapsedText.textContent = '';
    }
  }

  function startTimer(startIso){
    stopTimer();
    function tick(){
      var diffMs = Date.now() - new Date(startIso).getTime();
      if(diffMs < 0) diffMs = 0;
      var h = Math.floor(diffMs/3600000);
      var m = Math.floor((diffMs%3600000)/60000);
      var s = Math.floor((diffMs%60000)/1000);
      elapsedText.textContent = pad(h)+':'+pad(m)+':'+pad(s)+' עברו';
    }
    tick();
    timerInterval = setInterval(tick, 1000);
  }

  function stopTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }

  var audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }

  function playChime(isStart){
    var ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended'){ ctx.resume(); }
    var now = ctx.currentTime;
    var notes = isStart ? [440.00, 587.33] : [587.33, 440.00];
    notes.forEach(function(freq, i){
      var t = now + i*0.13;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.17, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.26);
    });
  }

  async function toggleShift(){
    var open = findOpenShift();
    var now = new Date();
    if(open){
      playChime(false);
      open.end = now.toISOString();
      var hrs = (new Date(open.end) - new Date(open.start)) / 3600000;
      open.hours = Math.round(hrs*100)/100;
      await saveShifts();
      showToast('המשמרת הסתיימה');
    } else {
      playChime(true);
      shifts.push({
        id: Date.now(),
        date: dateKey(now),
        start: now.toISOString(),
        end: null,
        hours: null
      });
      await saveShifts();
      showToast('המשמרת התחילה');
    }
    updateStatus();
    renderMonth();
  }

  function shiftsForMonth(y, m){
    return shifts.filter(function(s){
      var parts = s.date.split('-');
      return parseInt(parts[0])===y && (parseInt(parts[1])-1)===m;
    }).sort(function(a,b){ return new Date(b.start) - new Date(a.start); });
  }

  function formatHoursMinutes(hoursFloat){
    var totalMin = Math.round(hoursFloat*60);
    var h = Math.floor(totalMin/60);
    var m = totalMin%60;
    if(m===0) return h+' שעות';
    return h+' שע׳ '+m+' דק׳';
  }

  function renderMonth(){
    monthLabel.textContent = HEB_MONTHS[viewMonth]+' '+viewYear;
    var list = shiftsForMonth(viewYear, viewMonth);

    var totalHours = 0;
    var workDays = 0;
    list.forEach(function(s){
      if(s.hours!=null){ totalHours += s.hours; workDays++; }
    });
    monthHours.textContent = (Math.round(totalHours*10)/10);
    monthDays.textContent = workDays;

    dayList.innerHTML = '';

    if(list.length===0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<div>🖐️</div><p>אין עדיין משמרות מתועדות בחודש הזה</p>';
      dayList.appendChild(empty);
      return;
    }

    list.forEach(function(s){
      var card = document.createElement('div');
      card.className = 'day-card';

      var actions = document.createElement('div');
      actions.className = 'day-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.setAttribute('aria-label','עריכת משמרת');
      editBtn.innerHTML = ICON_EDIT;
      editBtn.addEventListener('click', function(){ openEditModal(s.id); });

      var delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.setAttribute('aria-label','מחיקת משמרת');
      delBtn.innerHTML = ICON_TRASH;
      delBtn.addEventListener('click', function(){ handleQuickDelete(s.id, delBtn); });

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      card.appendChild(actions);

      var dateRow = document.createElement('div');
      dateRow.className = 'date-row';
      var dateTxt = document.createElement('div');
      dateTxt.className = 'date-txt';
      dateTxt.innerHTML = ICON_FLOWER + '<span>'+escapeHtml(fmtDateLong(s.date))+'</span>';
      dateRow.appendChild(dateTxt);

      if(s.hours!=null){
        var hoursTxt = document.createElement('div');
        hoursTxt.className = 'hours-txt';
        hoursTxt.textContent = 'סה״כ '+formatHoursMinutes(s.hours);
        dateRow.appendChild(hoursTxt);
      } else {
        var openTxt = document.createElement('div');
        openTxt.className = 'hours-txt';
        openTxt.textContent = 'פעיל כעת';
        dateRow.appendChild(openTxt);
      }

      var timesRow = document.createElement('div');
      timesRow.className = 'times-row';

      var startBlock = document.createElement('div');
      startBlock.className = 'time-block';
      startBlock.innerHTML = '<div class="t-lbl">כניסה</div><div class="t-val">'+fmtTime(s.start)+'</div>';

      var endBlock = document.createElement('div');
      endBlock.className = 'time-block'+(s.end?'':' open');
      endBlock.innerHTML = '<div class="t-lbl">יציאה</div><div class="t-val">'+(s.end?fmtTime(s.end):'--:--')+'</div>';

      timesRow.appendChild(startBlock);
      timesRow.appendChild(endBlock);

      card.appendChild(dateRow);
      card.appendChild(timesRow);

      if(s.note && s.note.trim()){
        var noteRow = document.createElement('div');
        noteRow.className = 'note-row';
        noteRow.innerHTML = ICON_FLAG + '<span>'+escapeHtml(s.note)+'</span>';
        card.appendChild(noteRow);
      }

      dayList.appendChild(card);
    });
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function findShiftById(id){
    for(var i=0;i<shifts.length;i++){
      if(shifts[i].id===id) return shifts[i];
    }
    return null;
  }

  function openEditModal(id){
    var s = id ? findShiftById(id) : null;
    editingId = id || null;

    if(s){
      modalTitle.textContent = 'עריכת משמרת';
      editDate.value = s.date;
      editStart.value = fmtTime(s.start);
      editEnd.value = s.end ? fmtTime(s.end) : '';
      editNote.value = s.note || '';
      deleteEditBtn.style.display = 'block';
    } else {
      modalTitle.textContent = 'הוספת משמרת';
      var now = new Date();
      editDate.value = dateKey(now);
      editStart.value = '';
      editEnd.value = '';
      editNote.value = '';
      deleteEditBtn.style.display = 'none';
    }

    editError.style.display = 'none';
    deleteEditBtn.textContent = 'מחיקת משמרת';
    deleteEditBtn.classList.remove('confirm');
    modalOverlay.classList.remove('hidden');
  }

  function closeModal(){
    modalOverlay.classList.add('hidden');
    editingId = null;
    if(deleteConfirmTimeout){ clearTimeout(deleteConfirmTimeout); deleteConfirmTimeout = null; }
  }

  cancelEditBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){
    if(e.target === modalOverlay) closeModal();
  });

  saveEditBtn.addEventListener('click', async function(){
    var isNew = !editingId;
    var s = isNew ? null : findShiftById(editingId);
    if(!isNew && !s) return;

    var dateVal = editDate.value;
    var startVal = editStart.value;
    var endVal = editEnd.value;

    if(!dateVal || !startVal){
      editError.textContent = 'יש למלא תאריך ושעת כניסה';
      editError.style.display = 'block';
      return;
    }

    var dateParts = dateVal.split('-');
    var startParts = startVal.split(':');
    var startDate = new Date(parseInt(dateParts[0]), parseInt(dateParts[1])-1, parseInt(dateParts[2]), parseInt(startParts[0]), parseInt(startParts[1]));

    var endDate = null;
    if(endVal){
      var endParts = endVal.split(':');
      endDate = new Date(parseInt(dateParts[0]), parseInt(dateParts[1])-1, parseInt(dateParts[2]), parseInt(endParts[0]), parseInt(endParts[1]));
      if(endDate <= startDate){
        endDate = new Date(endDate.getTime() + 24*3600000);
      }
    } else {
      var otherOpen = shifts.find(function(x){ return !x.end && x.id!==editingId; });
      if(otherOpen){
        editError.textContent = 'כבר יש משמרת פתוחה אחרת. סגרי אותה קודם';
        editError.style.display = 'block';
        return;
      }
    }

    editError.style.display = 'none';

    if(isNew){
      s = { id: Date.now() + Math.floor(Math.random()*1000) };
      shifts.push(s);
    }

    s.date = dateVal;
    s.start = startDate.toISOString();
    if(endDate){
      s.end = endDate.toISOString();
      s.hours = Math.round(((endDate-startDate)/3600000)*100)/100;
    } else {
      s.end = null;
      s.hours = null;
    }
    s.note = editNote.value.trim();

    await saveShifts();
    closeModal();
    updateStatus();
    viewYear = parseInt(dateParts[0]);
    viewMonth = parseInt(dateParts[1]) - 1;
    renderMonth();
    showToast(isNew ? 'המשמרת נוספה' : 'המשמרת עודכנה');
  });

  deleteEditBtn.addEventListener('click', async function(){
    if(!deleteEditBtn.classList.contains('confirm')){
      deleteEditBtn.classList.add('confirm');
      deleteEditBtn.textContent = 'לחצי שוב לאישור מחיקה';
      deleteConfirmTimeout = setTimeout(function(){
        deleteEditBtn.classList.remove('confirm');
        deleteEditBtn.textContent = 'מחיקת משמרת';
      }, 4000);
      return;
    }
    if(deleteConfirmTimeout){ clearTimeout(deleteConfirmTimeout); deleteConfirmTimeout = null; }
    shifts = shifts.filter(function(x){ return x.id!==editingId; });
    await saveShifts();
    closeModal();
    updateStatus();
    renderMonth();
    showToast('המשמרת נמחקה');
  });

  function handleQuickDelete(id, btnEl){
    if(!btnEl.classList.contains('confirm')){
      btnEl.classList.add('confirm', 'confirm-label');
      btnEl.innerHTML = 'למחוק?';
      btnEl._confirmTimeout = setTimeout(function(){
        btnEl.classList.remove('confirm','confirm-label');
        btnEl.innerHTML = ICON_TRASH;
      }, 3500);
      return;
    }
    if(btnEl._confirmTimeout) clearTimeout(btnEl._confirmTimeout);
    shifts = shifts.filter(function(x){ return x.id!==id; });
    saveShifts();
    updateStatus();
    renderMonth();
    showToast('המשמרת נמחקה');
  }

  function changeMonth(delta){
    viewMonth += delta;
    if(viewMonth>11){ viewMonth=0; viewYear++; }
    if(viewMonth<0){ viewMonth=11; viewYear--; }
    renderMonth();
  }

  document.getElementById('addShiftBtn').addEventListener('click', function(){ openEditModal(null); });
  document.getElementById('prevMonthBtn').addEventListener('click', function(){ changeMonth(-1); });
  document.getElementById('nextMonthBtn').addEventListener('click', function(){ changeMonth(1); });
  thumbBtn.addEventListener('click', toggleShift);

  async function init(){
    var now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    updateTodayLabel();
    await loadShifts();
    updateStatus();
    renderMonth();
  }

  init();
})();
</script>
